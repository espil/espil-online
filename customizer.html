<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 커스터마이저 - 오클랜드 타임스톤 앞</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Malgun Gothic", sans-serif; color: #2b2b2b; background: #79c7d8; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- 장면: 단색 plain 배경 ---------- */
  #scene { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(180deg, #d9edf0 0%, #eef5ef 55%, #faf3e0 100%); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 3D 배경이 켜지면 CSS 배경 요소는 숨긴다 (WebGL 실패 시 폴백으로 남는다) */
  body.gl-on .sky, body.gl-on .sun, body.gl-on .skyline, body.gl-on .horizon-glow,
  body.gl-on .sea, body.gl-on .sea-shimmer, body.gl-on .lightpath, body.gl-on .shore,
  body.gl-on .vortex-glow, body.gl-on .ring, body.gl-on .stone, body.gl-on .particle { display: none; }
  .sky { position: absolute; inset: 0; background: linear-gradient(#6fc3d4 0%, #a9dfe8 38%, #d8f1ee 52%, #ffe9bd 60%, #f7d9a8 62%); }
  .sun { position: absolute; right: 38%; top: 9%; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,248,214,.95) 0%, rgba(255,236,170,.55) 40%, rgba(255,236,170,0) 70%); }
  .sea { position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: linear-gradient(#3aa7a0 0%, #2a8a92 30%, #1e6d7a 70%, #175a6b 100%); }
  .sea-shimmer { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; opacity: .35;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 2px, transparent 2px 90px); }
  .lightpath { position: absolute; left: 50%; top: 60%; width: 340px; height: 40%; transform: translateX(-50%);
    background: linear-gradient(rgba(255,240,190,.55), rgba(255,240,190,0)); filter: blur(14px); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }
  .skyline { position: absolute; left: 0; right: 0; bottom: 40%; height: 110px; opacity: .55; }
  .skyline svg { width: 100%; height: 100%; display: block; }
  .horizon-glow { position: absolute; left: 0; right: 0; bottom: 40%; height: 26px;
    background: linear-gradient(rgba(255,244,205,.9), rgba(255,244,205,0)); }

  /* 타임스톤 + 소용돌이 (캐릭터 뒤) */
  #stage-scene { position: absolute; left: calc((100vw - 372px) / 2); transform: translateX(-50%); bottom: 88px; width: min(52vh, 480px); height: min(52vh, 480px); }
  .vortex-glow { position: absolute; left: 50%; top: 8%; width: 110%; height: 78%; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(120,240,230,.65) 0%, rgba(80,200,220,.28) 45%, rgba(80,200,220,0) 70%);
    animation: pulse 4.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  .ring { position: absolute; left: 50%; top: 26%; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  .ring.a { width: 64%; aspect-ratio: 1; background: conic-gradient(from 0deg, transparent 0 12%, #bdf6ef 18%, #3ec9bd 30%, transparent 42%, transparent 55%, #e8fffa 62%, #2fb5aa 74%, transparent 86%);
    -webkit-mask: radial-gradient(closest-side, transparent 62%, #000 63%, #000 72%, transparent 73%);
    mask: radial-gradient(closest-side, transparent 62%, #000 63%, #000 72%, transparent 73%);
    animation: spin 16s linear infinite; opacity: .85; }
  .ring.b { width: 52%; aspect-ratio: 1; background: conic-gradient(from 180deg, transparent 0 20%, #ffffff 26%, #6fe3d6 40%, transparent 52%, transparent 68%, #c9fff6 76%, #35b8ad 88%, transparent 96%);
    -webkit-mask: radial-gradient(closest-side, transparent 60%, #000 61%, #000 70%, transparent 71%);
    mask: radial-gradient(closest-side, transparent 60%, #000 61%, #000 70%, transparent 71%);
    animation: spinrev 24s linear infinite; opacity: .8; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes spinrev { to { transform: translate(-50%, -50%) rotate(-360deg); } }
  .stone { position: absolute; left: 50%; bottom: 9%; width: 34%; height: 62%; transform: translateX(-50%);
    background: linear-gradient(105deg, #5c6670 0%, #3c454e 45%, #2c343c 70%, #46505a 100%);
    border-radius: 46% 46% 14% 14% / 22% 22% 8% 8%; box-shadow: inset -14px 0 24px rgba(0,0,0,.35), inset 10px 0 18px rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.35); }
  .stone .spiral { position: absolute; left: 50%; top: 18%; width: 58%; aspect-ratio: 1; transform: translateX(-50%);
    border-radius: 50%; background: conic-gradient(from 0deg, #8ff5e8, #2fb5aa 25%, #0e7f86 50%, #bdf6ef 75%, #8ff5e8);
    -webkit-mask: radial-gradient(closest-side, transparent 30%, #000 31%, #000 46%, transparent 47%, transparent 58%, #000 59%, #000 74%, transparent 75%);
    mask: radial-gradient(closest-side, transparent 30%, #000 31%, #000 46%, transparent 47%, transparent 58%, #000 59%, #000 74%, transparent 75%);
    animation: spinplain 40s linear infinite; box-shadow: 0 0 22px rgba(120,240,230,.8); }
  @keyframes spinplain { to { transform: translateX(-50%) rotate(360deg); } }
  .particle { position: absolute; border-radius: 50%; background: #dffef9; box-shadow: 0 0 10px #8ff5e8; animation: floaty 5s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-26px); opacity: 1; } }
  .platform { position: absolute; left: 50%; bottom: 0; width: 108%; height: 11%; transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 30%, #8a939c 0%, #5c6670 45%, #3c454e 100%);
    border-radius: 50%; box-shadow: 0 12px 22px rgba(0,0,0,.4), inset 0 -8px 14px rgba(0,0,0,.35); }
  .platform::after { content: ""; position: absolute; inset: 14% 8% 30% 8%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,.18), transparent 70%); }

  /* 캐릭터 */
  #charwrap { position: absolute; inset: 0; }
  .nametag { position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    background: rgba(20,20,26,.82); border: 1px solid rgba(255,209,102,.55); color: #ffe9a8;
    padding: 4px 16px; border-radius: 999px; font-size: 15px; font-weight: 700; white-space: nowrap; z-index: 3; }
  canvas#view { position: absolute; left: 0; bottom: 3.2%; width: 100%; height: 100%; z-index: 2; }
  .cshadow { position: absolute; left: 50%; bottom: 3.9%; width: 46%; height: 3.6%; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(10,20,24,.5) 0%, rgba(10,20,24,0) 68%); z-index: 1; }
  .shore { position: absolute; bottom: -10px; width: 340px; height: 120px; background: #22333b; z-index: 1; }
  .shore.left { left: -40px; border-radius: 60% 40% 0 0 / 100% 100% 0 0; }
  .shore.right { right: -30px; border-radius: 40% 60% 0 0 / 100% 100% 0 0; width: 300px; }

  /* ---------- 오른쪽 패널 (메이플스토리2 방식) ---------- */
  #panel { position: fixed; right: 0; top: 0; bottom: 0; width: 372px; z-index: 10;
    background: rgba(252,250,246,.96); box-shadow: -4px 0 24px rgba(0,0,0,.25);
    overflow-y: auto; padding: 18px 18px 22px; }
  .panel-title { font-size: 21px; font-weight: 800; margin: 2px 0 14px; letter-spacing: -.01em; }
  .gender-seg { display: flex; gap: 8px; margin-bottom: 16px; }
  .gender-seg button { flex: 1; padding: 11px 0; font-size: 16px; font-weight: 700; border-radius: 10px;
    border: 1.5px solid #d8d2c6; background: #fff; color: #6b655a; }
  .gender-seg button.on { background: #ff8c1a; border-color: #ff8c1a; color: #fff; }
  .preview { display: flex; gap: 14px; align-items: center; background: #fff; border: 1.5px solid #e3ddd0;
    border-radius: 14px; padding: 12px; margin-bottom: 16px; }
  .preview img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: #eef2f4; border: 1px solid #e3ddd0; }
  .preview .meta { flex: 1; min-width: 0; }
  .preview .meta .cat { font-size: 12px; color: #8a8378; }
  .preview .meta .sel { font-size: 16px; font-weight: 800; margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zoomrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8a8378; }
  .zoomrow input[type="range"] { flex: 1; accent-color: #ff8c1a; }
  .acc { border: 1.5px solid #e3ddd0; border-radius: 12px; margin-bottom: 10px; background: #fff; overflow: hidden; }
  .acc-head { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none;
    padding: 13px 14px; font-size: 15.5px; font-weight: 700; text-align: left; color: #2b2b2b; }
  .acc-head .sum { flex: 1; font-size: 12.5px; font-weight: 400; color: #8a8378; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acc-head .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #d8d2c6; flex: none; }
  .acc-head .chev { color: #b0a99c; font-size: 13px; }
  .acc-body { padding: 0 14px 14px; display: none; }
  .acc.open .acc-body { display: block; }
  .acc.open .acc-head .chev { transform: rotate(180deg); }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .thumb { border: 2px solid #e3ddd0; border-radius: 10px; padding: 0; background: #f4f6f7; overflow: hidden; }
  .thumb img { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; }
  .thumb span { display: block; font-size: 11px; padding: 4px 2px 5px; color: #5a554c; line-height: 1.25; }
  .thumb.on { border-color: #ff8c1a; box-shadow: 0 0 0 2px rgba(255,140,26,.25); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #d8d2c6; padding: 0; }
  .sw.on { border-color: #ff8c1a; box-shadow: 0 0 0 2px rgba(255,140,26,.3); }
  .tone { display: flex; gap: 8px; }
  .tone button { flex: 1; padding: 9px 0; border-radius: 10px; border: 2px solid #e3ddd0; background: #fff; font-size: 13px; font-weight: 700; color: #5a554c; }
  .tone button.on { border-color: #ff8c1a; color: #ff8c1a; }
  .note { font-size: 12.5px; color: #8a8378; line-height: 1.6; margin: 8px 0 0; }
  .name-row { display: flex; gap: 8px; align-items: center; margin: 16px 0 12px; }
  .name-row label { font-size: 14px; font-weight: 700; flex: none; }
  .name-row input { flex: 1; border: 1.5px solid #e3ddd0; border-radius: 10px; padding: 10px 12px; font-size: 15px; min-width: 0; }
  .name-row .cnt { font-size: 12px; color: #8a8378; flex: none; }
  .actions { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .iconbtn { width: 52px; border-radius: 12px; border: 1.5px solid #e3ddd0; background: #fff; font-size: 20px; }
  .create { flex: 1; padding: 15px 0; font-size: 18px; font-weight: 800; border: none; border-radius: 12px;
    background: #ffb400; color: #3a2a00; box-shadow: 0 3px 0 #d99a00; }
  .create:active { transform: translateY(2px); box-shadow: 0 1px 0 #d99a00; }
  .utils { display: flex; gap: 8px; }
  .utils button { flex: 1; padding: 10px 0; font-size: 13.5px; border-radius: 10px; border: 1.5px solid #e3ddd0; background: #fff; color: #5a554c; }
  .foot-note { font-size: 12px; color: #a39d90; line-height: 1.6; margin-top: 14px; }

  /* ---------- 장면 위 컨트롤 ---------- */
  #controls { position: fixed; left: 18px; bottom: 18px; z-index: 9; display: flex; gap: 8px; align-items: center; }
  .ctl { width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(20,20,26,.72); color: #fff;
    font-size: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  .ctl.on { background: #ff8c1a; }
  .dirpills { display: flex; gap: 6px; background: rgba(20,20,26,.72); border-radius: 999px; padding: 5px; }
  .dirpills button { border: none; background: transparent; color: #cfd4d8; border-radius: 999px; padding: 8px 13px; font-size: 13.5px; font-weight: 700; }
  .dirpills button.on { background: #fff; color: #222; }
  #strip { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9; display: flex; gap: 8px; }
  #strip figure { margin: 0; text-align: center; cursor: pointer; }
  #strip canvas { width: 64px; height: 64px; border-radius: 12px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(20,20,26,.55); }
  #strip figure.on canvas { border-color: #ffb400; }
  #strip figcaption { font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); margin-top: 2px; }

  @media (max-width: 980px) {
    body { overflow: auto; }
    #scene { position: relative; height: 62vh; }
    #stage-scene { left: 50%; transform: translateX(-50%); bottom: 60px; width: min(58vh, 88vw); height: min(58vh, 88vw); }
    #panel { position: static; width: 100%; box-shadow: none; }
    #strip { display: none; }
    #controls { bottom: auto; top: 12px; }
  }
</style>
</head>
<body>
<div id="scene">
  <div id="stage-scene">
    <div class="platform"></div>
    <div id="charwrap">
      <div class="nametag" id="nametag">모험가</div>
      <div class="cshadow"></div>
      <canvas id="view" width="920" height="920"></canvas>
    </div>
  </div>
</div>

<div id="panel">
  <div class="panel-title">캐릭터 꾸미기</div>
  <div class="gender-seg" id="genderSeg"></div>
  <div class="preview">
    <img id="previewImg" alt="선택한 스타일 미리보기">
    <div class="meta">
      <div class="cat" id="previewCat">헤어</div>
      <div class="sel" id="previewSel">기본</div>
    </div>
  </div>
  <div id="accs"></div>
  <div class="name-row">
    <label for="nameInput">이름</label>
    <input type="text" id="nameInput" value="모험가" maxlength="12">
    <span class="cnt" id="nameCnt">3/12</span>
  </div>
  <div class="actions">
    <button class="iconbtn" id="randomBtn" title="랜덤">🎲</button>
    <button class="iconbtn" id="resetBtn" title="초기화">↺</button>
    <button class="create" id="createBtn">만들기</button>
  </div>
  <div class="utils">
    <button id="exportBtn">현재 방향 PNG</button>
    <button id="sheetBtn">4방향 시트 PNG</button>
  </div>
  <p class="foot-note">헤어와 눈 스타일은 정면 애니메이션에 적용됩니다. 옷 갈아입기는 정면 애니메이션과 정지 포즈에 적용됩니다. 측면과 뒷면은 기본형에 색상과 피부 톤이 적용됩니다. 방향키 (← →) 로도 방향을 돌릴 수 있습니다.</p>
</div>

<div id="controls">
  <button class="ctl" id="spinBtn" title="자동 회전">⟳</button>
  <button class="ctl" id="idleBtn" title="idle 재생 / 정지">▶</button>
  <button class="ctl" id="atkBtn" title="공격 모션 재생 / 정지">⚔</button>
  <div class="dirpills" id="dirpills"></div>
</div>
<div id="strip"></div>

<script>
const DIRS = [
  { id: "S", label: "정면", view: "front", flip: false },
  { id: "E", label: "오른쪽", view: "side", flip: false },
  { id: "N", label: "뒷면", view: "back", flip: false },
  { id: "W", label: "왼쪽", view: "side", flip: true },
];
const SKINS = [
  { id: "default", label: "기본", suffix: "", css: "#f0cfb2" },
  { id: "light", label: "밝게", suffix: "_light", css: "#f7ddc4" },
  { id: "deep", label: "구릿빛", suffix: "_deep", css: "#cf9a68" },
];
const HAIR_COLORS = [
  { id: "original", label: "원본 남색", css: "#39415e", rgb: null },
  { id: "black", label: "검정", css: "#26262c", rgb: [42, 42, 48] },
  { id: "brown", label: "갈색", css: "#7a4a28", rgb: [122, 74, 40] },
  { id: "red", label: "빨강", css: "#b03030", rgb: [176, 48, 48] },
  { id: "orange", label: "주황", css: "#c96a2c", rgb: [201, 106, 44] },
  { id: "blond", label: "금발", css: "#d9a94f", rgb: [217, 169, 79] },
  { id: "green", label: "초록", css: "#3f8f4f", rgb: [63, 143, 79] },
  { id: "blue", label: "파랑", css: "#3a5fbf", rgb: [58, 95, 191] },
  { id: "violet", label: "보라", css: "#7a4fa0", rgb: [122, 79, 160] },
  { id: "pink", label: "분홍", css: "#d97fa6", rgb: [217, 127, 166] },
  { id: "emerald", label: "에메랄드", css: "#28b496", rgb: [40, 180, 150] },
  { id: "white", label: "흰색", css: "#ebebf0", rgb: [235, 235, 240] },
];
const EYE_COLORS = [
  { id: "original", label: "원본 갈색", css: "#8a5522", rgb: null },
  { id: "black", label: "검정", css: "#2c2c30", rgb: [44, 44, 48] },
  { id: "blue", label: "파랑", css: "#3a6abf", rgb: [58, 106, 191] },
  { id: "green", label: "초록", css: "#3f8f4f", rgb: [63, 143, 79] },
  { id: "violet", label: "보라", css: "#7a4fa0", rgb: [122, 79, 160] },
  { id: "red", label: "빨강", css: "#b03030", rgb: [176, 48, 48] },
  { id: "gray", label: "회색", css: "#8b8f96", rgb: [139, 143, 150] },
];
const HAIR_LUM_REF = 0.234;
const EYE_LUM_REF = 0.34;

const HAIR_STYLES = {
  male: [
    { id: "default", label: "기본 뭉게머리" },
    { id: "hair2", label: "사이드 파트" },
    { id: "hair3", label: "포니테일" },
    { id: "hair4", label: "스파이키 크롭" },
  ],
  female: [
    { id: "default", label: "기본 트윈테일" },
    { id: "hair2", label: "단발 보브" },
    { id: "hair3", label: "히메 롱" },
    { id: "hair4", label: "사이드 포니테일" },
  ],
};
const EYE_STYLES = {
  male: [
    { id: "default", label: "기본 눈" },
    { id: "sharp", label: "날카로운 눈" },
    { id: "half", label: "반쯤 감긴 눈" },
    { id: "round", label: "둥근 눈" },
    { id: "droopy", label: "처진 눈" },
  ],
  female: [
    { id: "default", label: "기본 눈" },
    { id: "sharp", label: "올라간 눈" },
    { id: "droopy", label: "처진 눈" },
    { id: "round", label: "둥근 눈" },
    { id: "sanpaku", label: "삼백안" },
  ],
};
const HAIR_SETS = {
  male: {
    hair2: { dir: "idle_hair2_raw", prefix: "male_hair2", n: 24 },
    hair3: { dir: "idle_male_hair3_raw", prefix: "male_hair3", n: 24 },
    hair4: { dir: "idle_male_hair4_raw", prefix: "male_hair4", n: 24 },
  },
  female: {
    hair2: { dir: "idle_female_hair2_raw", prefix: "female_hair2", n: 21 },
    hair3: { dir: "idle_female_hair3_raw", prefix: "female_hair3", n: 19 },
    hair4: { dir: "idle_female_hair4_raw", prefix: "female_hair4", n: 25 },
  },
};
const EYE_SETS = {
  male: {
    sharp: { dir: "idle_male_eyes_sharp_raw", prefix: "male_eyes_sharp", n: 22 },
    half: { dir: "idle_male_eyes_half_raw", prefix: "male_eyes_half", n: 16 },
    round: { dir: "idle_male_eyes_round_raw", prefix: "male_eyes_round", n: 20 },
    droopy: { dir: "idle_male_eyes_droopy_raw", prefix: "male_eyes_droopy", n: 21 },
  },
  female: {
    sharp: { dir: "idle_female_eyes_sharp_raw", prefix: "female_eyes_sharp", n: 20 },
    droopy: { dir: "idle_female_eyes_droopy_raw", prefix: "female_eyes_droopy", n: 27 },
    round: { dir: "idle_female_eyes_round_raw", prefix: "female_eyes_round", n: 34 },
    sanpaku: { dir: "idle_female_eyes_sanpaku_raw", prefix: "female_eyes_sanpaku", n: 25 },
  },
};

const OUTFIT_SETS = {
  male: {
    outfit2: { dir: "idle_male_outfit2_raw", prefix: "male_outfit2", n: 28 },
    armor1: { dir: "idle_male_armor1_raw", prefix: "male_armor1", n: 32 },
    armor2: { dir: "idle_male_armor2_raw", prefix: "male_armor2", n: 28 },
    robe1: { dir: "idle_male_robe1_raw", prefix: "male_robe1", n: 27 },
  },
  female: {

    armor1: { dir: "idle_female_armor1_raw", prefix: "female_armor1", n: 40 },

const tintCache = new Map();
async function tintedLayer(src, rgb) {
  const key = src + "|" + rgb.join(",");
  if (tintCache.has(key)) return tintCache.get(key);
  const img = await loadImg(src);
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  const px = data.data;
  const lums = [];
  for (let i = 0; i < px.length; i += 4) {
    if (px[i + 3] > 10) lums.push((0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255);
  }
  lums.sort((a, b) => a - b);
  const ref = lums[Math.floor(lums.length / 2)] || 0.3;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i + 3] === 0) continue;
    const lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
    if (lum < 0.16) continue; // outline line art keeps its original colour
    const k = lum / ref;
    px[i] = Math.min(255, rgb[0] * k);
    px[i + 1] = Math.min(255, rgb[1] * k);
    px[i + 2] = Math.min(255, rgb[2] * k);
  }
  ctx.putImageData(data, 0, 0);

  return c;
}
async function buildComposite(skin) {

    await draw(`assets/customizer/parts/female_front_face${skin.suffix}.png`);

}

const imgCache = new Map();

const procCache = new Map();

const WEAPONS = [
  { id: "none", label: "맨손" },
  { id: "guard", label: "수호자 · 얼음검/방패" },

// Attack sets: assets/customizer/attack/<set>/<set>_NN.webp. Side frames face left,

const ATTACK_SETS = {
  male: {
    none: { S: { set: "male_front", n: 15 } },
    guard: { S: { set: "male_guard3", n: 14 }, E: { set: "male_guard3_side", n: 13, flip: true }, W: { set: "male_guard3_side", n: 13 }, N: { set: "male_guard3_back", n: 12 } },
    greatsword: { S: { set: "male_greatsword", n: 20 }, E: { set: "male_greatsword_side", n: 20, flip: true }, W: { set: "male_greatsword_side", n: 20 }, N: { set: "male_greatsword_back", n: 14 } },
    bow: { S: { set: "male_bow", n: 48 }, E: { set: "male_bow_side", n: 48, flip: true }, W: { set: "male_bow_side", n: 48 }, N: { set: "male_bow_back", n: 48 } },

function attackSetFor(dirEntry) {

function preloadIdle() {
  if (!state.idle) return;

async function buildCanvas(dirEntry, frameIdx = -1) {
  if (state.attack && frameIdx >= 0) {
    const atk = attackSetFor(dirEntry);
    if (atk) {
      const img = await loadImg(`assets/customizer/attack/${atk.set}/${atk.set}_${String(frameIdx % atk.n).padStart(2, "0")}.webp`);
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const actx = c.getContext("2d");
      if (atk.flip) { actx.translate(c.width, 0); actx.scale(-1, 1); }
      actx.drawImage(img, 0, 0);
      return c;
    }
  }
  const skin = SKINS.find(s => s.id === state.skin);
  const useIdle = frameIdx >= 0 && dirEntry.view === "front";
  const outfitSig = state.gender === "female" ? JSON.stringify(state.outfitF) + state.kindF : JSON.stringify(state.outfitM);
  const key = [state.gender, dirEntry.view, state.skin, state.hairStyle, state.eyeStyle,
    state.hairColor, state.eyeColor, outfitSig, state.outfitStyle, useIdle ? "i" + frameIdx : "s"].join("|");
  if (procCache.has(key)) {
    const src = procCache.get(key);
    const out = document.createElement("canvas");
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext("2d");
    if (dirEntry.flip) { ctx.translate(out.width, 0); ctx.scale(-1, 1); }

    return out;

    c = await buildComposite(skin);

    let srcPath;
    if (useIdle) srcPath = frameSrc(frameIdx);
    else if (dirEntry.view === "front" && (activeSet() || outfitSet())) srcPath = frameSrc(0);
    else srcPath = `assets/customizer/base/${state.gender}_${dirEntry.view}${skin.suffix}.png`;
    const img = await loadImg(srcPath);
    c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    if (useIdle && maleTintActive()) {
      const octx = c.getContext("2d");
      for (const slot of ["shoes", "bottom", "top"]) {
        const col = state.outfitM[slot];
        if (col !== "original") {
          const im = await loadImg(`assets/customizer/tint_layers/${slot}_${col}/f${String(frameIdx % 24).padStart(2, "0")}.webp`);

    const px = data.data, W = c.width, H = c.height;
    for (let i = 0; i < px.length; i += 4) {

      const r = px[i], g = px[i + 1], b = px[i + 2];
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const p = i / 4, x = p % W, y = (p / W) | 0;
      const zw = state.gender === "female" ? [0.36, 0.62, 0.80] : [0.30, 0.68, 0.74];
      const inHairZone = y < H * 0.535 || (y < H * zw[2] && (x < W * zw[0] || x > W * zw[1]));
      if (hair.rgb && inHairZone && b > r + 6 && b > g + 2 && lum > 0.015 && lum < 0.75) {
        const k = lum / HAIR_LUM_REF;
        px[i] = Math.min(255, hair.rgb[0] * k);
        px[i + 1] = Math.min(255, hair.rgb[1] * k);
        px[i + 2] = Math.min(255, hair.rgb[2] * k);
        continue;

      if (eye.rgb && dirEntry.view !== "back") {

          ? (y > H * 0.28 && y < H * 0.50 && x > W * 0.22 && x < W * 0.78)
          : (y > H * 0.28 && y < H * 0.50 && x > W * 0.10 && x < W * 0.60);

          const k = lum / EYE_LUM_REF;
          px[i] = Math.min(255, eye.rgb[0] * k);
          px[i + 1] = Math.min(255, eye.rgb[1] * k);
          px[i + 2] = Math.min(255, eye.rgb[2] * k);
        }

    ctx.putImageData(data, 0, 0);

      // the body region and tint by luminance. Skin (orange hues),
      // hair, and the brown gear fall outside the gate, so no tint
      // smears cross onto skin - the same separation the garment

      const data = ctx.getImageData(0, 0, c.width, c.height);
      const px = data.data, W = c.width, H = c.height;

      const lums = [];
      for (let i = 0; i < px.length; i += 4) {

        px[i] = Math.min(255, kind.rgb[0] * k);
        px[i + 1] = Math.min(255, kind.rgb[1] * k);

function frontFrameIdx() { return (state.idle && (!clothesActive() || clothesAnimSet() || maleTintActive())) ? idleFrame % idleCount() : -1; }

async function render() {

    const sc = document.createElement("canvas");
    sc.width = 256; sc.height = 256;
    sc.id = "strip_" + d.id;

    sc.getContext("2d").drawImage(b, 0, 0, 256, 256);

<script>
function thumbFor(kind, styleId) {

  }

    ? `assets/customizer/thumbs/${state.gender}_eyes.jpg`
    : `assets/customizer/thumbs/${EYE_SETS[state.gender][styleId].prefix}_eyes.jpg`;
}
function styleLabel(list, id) { const it = list.find(x => x.id === id); return it ? it.label : id; }
function colorCss(list, id) { const it = list.find(x => x.id === id); return it ? it.css : "#ccc"; }

function accSection(id, title, summary, dotCss, bodyHtml) {
  const wrap = document.createElement("div");
  wrap.className = "acc" + (openCat === id ? " open" : "");
  wrap.innerHTML = `<button class="acc-head">${title}<span class="sum">${summary}</span>` +
    (dotCss ? `<span class="dot" style="background:${dotCss}"></span>` : "") +
    `<span class="chev">▾</span></button><div class="acc-body">${bodyHtml}</div>`;
  wrap.querySelector(".acc-head").onclick = () => { openCat = id; refreshPanel(); };
  return wrap;
}
function thumbsHtml(kind, styles, current) {
  return `<div class="thumbs">` + styles.map(s =>
    `<button class="thumb${s.id === current ? " on" : ""}" data-kind="${kind}" data-id="${s.id}">` +
    `<img src="${thumbFor(kind, s.id)}" alt=""><span>${s.label}</span></button>`).join("") + `</div>`;
}
function swatchesHtml(list, current, action) {
  return `<div class="swatches">` + list.map(c =>
    `<button class="sw${c.id === current ? " on" : ""}" data-action="${action}" data-id="${c.id}" style="background:${c.css}" title="${c.label}"></button>`).join("") + `</div>`;
}

function refreshPanel() {
  const seg = document.getElementById("genderSeg");
  seg.innerHTML = "";
  for (const g of [{ id: "male", label: "남 ♂" }, { id: "female", label: "여 ♀" }]) {
    const b = document.createElement("button");
    b.textContent = g.label;
    if (g.id === state.gender) b.className = "on";
    b.onclick = () => {
      if (state.gender === g.id) return;
      state.gender = g.id;
      if (!EYE_STYLES[g.id].some(s => s.id === state.eyeStyle)) state.eyeStyle = "default";
      if (!HAIR_STYLES[g.id].some(s => s.id === state.hairStyle)) state.hairStyle = "default";

  const hair = HAIR_STYLES[state.gender], eyes = EYE_STYLES[state.gender];
  const accs = document.getElementById("accs");
  accs.innerHTML = "";
  accs.appendChild(accSection("hair", "헤어",
    styleLabel(hair, state.hairStyle) + " · " + (HAIR_COLORS.find(c => c.id === state.hairColor) || {}).label,
    colorCss(HAIR_COLORS, state.hairColor),
    thumbsHtml("hair", hair, state.hairStyle) + swatchesHtml(HAIR_COLORS, state.hairColor, "hairColor") +
    `<p class="note">염색은 전 방향에 적용됩니다.</p>`));
  accs.appendChild(accSection("face", "얼굴",
    styleLabel(eyes, state.eyeStyle) + " · " + (EYE_COLORS.find(c => c.id === state.eyeColor) || {}).label,
    colorCss(EYE_COLORS, state.eyeColor),
    thumbsHtml("face", eyes, state.eyeStyle) + swatchesHtml(EYE_COLORS, state.eyeColor, "eyeColor") +
    `<p class="note">눈 스타일은 정면 애니메이션에, 눈 색상은 정면과 측면에 적용됩니다.</p>`));
  const toneHtml = `<div class="tone">` + SKINS.map(s =>
    `<button data-skin="${s.id}" class="${s.id === state.skin ? "on" : ""}" style="background:${s.css}22">${s.label}</button>`).join("") + `</div>`;

function refreshAll() {
  idleFrame = idleFrame % idleCount();
  refreshPanel();
  render();
}

document.getElementById("nameInput").addEventListener("input", e => {
  state.name = e.target.value;
  document.getElementById("nameCnt").textContent = (state.name || "").length + "/12";
  document.getElementById("nametag").textContent = state.name || "모험가";
});
document.getElementById("idleBtn").onclick = () => { state.idle = !state.idle; refreshAll(); };
document.getElementById("atkBtn").onclick = () => { state.attack = !state.attack; attackFrame = 0; refreshAll(); };
document.getElementById("randomBtn").onclick = () => {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)].id;
  state.gender = pick([{ id: "male" }, { id: "female" }]);
  state.skin = pick(SKINS);
  state.hairStyle = pick(HAIR_STYLES[state.gender]);
  state.eyeStyle = pick(EYE_STYLES[state.gender]);
  state.hairColor = pick(HAIR_COLORS);
  state.eyeColor = pick(EYE_COLORS);
  state.dir = pick(DIRS);
  state.outfitF.top = "on";
  state.kindF = pick(FEMALE_KINDS);
  state.outfitStyle = pick(OUTFIT_STYLES);
  for (const s of ["bottom", "shoes"]) {
    state.outfitF[s] = Math.random() < 0.75 ? "on" : "off";
  }
  for (const s of ["top", "bottom", "shoes"]) {
    state.outfitM[s] = pick(GARMENT_COLORS);
  }
  refreshAll();
};
document.getElementById("resetBtn").onclick = () => {
  state = { ...DEFAULTS, outfitF: { ...DEFAULTS.outfitF }, outfitM: { ...DEFAULTS.outfitM } };
  openCat = "hair";
  document.getElementById("nameInput").value = state.name;
  refreshAll();
};
function download(canvas, filename) {
  const a = document.createElement("a");
  a.download = filename;
  a.href = canvas.toDataURL("image/png");
  a.click();
}
document.getElementById("exportBtn").onclick = async () => {
  const d = DIRS.find(x => x.id === state.dir);
  download(await buildCanvas(d), `character_${state.gender}_${state.dir}_${state.skin}_${state.hairStyle}_${state.eyeStyle}_${state.hairColor}_${state.eyeColor}.png`);
};
document.getElementById("sheetBtn").onclick = async () => {
  const parts = [];
  for (const d of DIRS) parts.push(await buildCanvas(d));
  const sheet = document.createElement("canvas");
  sheet.width = 1024 * 4; sheet.height = 1024;
  const ctx = sheet.getContext("2d");
  parts.forEach((p, i) => ctx.drawImage(p, i * 1024, 0));
  download(sheet, `character_${state.gender}_4dir_sheet.png`);
};
document.getElementById("createBtn").onclick = (e) => {
  const data = {
    spec: "zealandia-customizer v0.2",
    name: state.name,
    gender: state.gender,
    skin: state.skin,
    hair: { style: state.hairStyle, color: state.hairColor },
    eyes: { style: state.eyeStyle, color: state.eyeColor },
    cosmetics: "none",
    outfit: state.gender === "female"
      ? { style: state.outfitStyle, kind: state.kindF, top: "default", bottom: state.outfitF.bottom === "on" ? "default" : "off", shoes: state.outfitF.shoes === "on" ? "default" : "off" }
      : { style: state.outfitStyle, top: state.outfitM.top, bottom: state.outfitM.bottom, shoes: state.outfitM.shoes },
    hat: "none",
    accessory: "none",
    weapon: state.weapon,
    directions: ["S", "E", "N", "W"],
    directionArt: { S: "front", E: "side", N: "back", W: "side (mirrored)" },
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.download = `character_${state.gender}.json`;
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  // Embed contract (espil.online): when iframed, the same character JSON
  // is posted to the parent window so it can be saved to the account.
  if (window.parent !== window) {
    window.parent.postMessage({ type: "zealandia-character", data }, "*");
  }
  const btn = e.currentTarget;
  btn.textContent = "저장했어요 ✓";
  setTimeout(() => { btn.textContent = "만들기"; }, 1400);
};
let spinning = false, spinTimer = null;
document.getElementById("spinBtn").onclick = (e) => {
  spinning = !spinning;
  e.currentTarget.classList.toggle("on", spinning);
  clearInterval(spinTimer);
  if (spinning) {
    spinTimer = setInterval(() => {
      const i = DIRS.findIndex(d => d.id === state.dir);
      state.dir = DIRS[(i + 1) % DIRS.length].id;
      refreshAll();
    }, 900);
  }
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const i = DIRS.findIndex(d => d.id === state.dir);
  if (e.key === "ArrowRight") { state.dir = DIRS[(i + 1) % 4].id; refreshAll(); }
  if (e.key === "ArrowLeft") { state.dir = DIRS[(i + 3) % 4].id; refreshAll(); }
});
async function idleTick() {
  if (state.attack) {
    const atk = attackSetFor(DIRS.find(x => x.id === state.dir));
    if (atk) {
      attackFrame = (attackFrame + 1) % atk.n;
      render();
      return;
    }
  }
  if (!state.idle || state.dir !== "S" || (clothesActive() && !clothesAnimSet() && !maleTintActive())) return;
  idleFrame = (idleFrame + 1) % idleCount();
  const d = DIRS.find(x => x.id === "S");
  const built = await buildCanvas(d, idleFrame);
  const view = document.getElementById("view");
  const ctx = view.getContext("2d");
  ctx.clearRect(0, 0, view.width, view.height);
  const z = state.zoom / 100;
  const w = view.width * z, h = view.height * z;
  ctx.drawImage(built, (view.width - w) / 2, view.height - h, w, h);
  const sc = document.getElementById("strip_S");
  if (sc) sc.getContext("2d").drawImage(built, 0, 0, 256, 256);
}
setInterval(idleTick, 1000 / 12);
// URL 파라미터로 외형 지정 (스크린샷/공유용): g, skin, hair, eyes, hc, ec, dir, top, bottom, shoes, name
(function applyParams() {
  const q = new URLSearchParams(location.search);
  if (q.get("g") === "female" || q.get("g") === "male") state.gender = q.get("g");
  if (SKINS.some(s => s.id === q.get("skin"))) state.skin = q.get("skin");
  if (HAIR_STYLES[state.gender].some(s => s.id === q.get("hair"))) state.hairStyle = q.get("hair");
  if (EYE_STYLES[state.gender].some(s => s.id === q.get("eyes"))) state.eyeStyle = q.get("eyes");
  if (HAIR_COLORS.some(c => c.id === q.get("hc"))) state.hairColor = q.get("hc");
  if (EYE_COLORS.some(c => c.id === q.get("ec"))) state.eyeColor = q.get("ec");
  if (DIRS.some(d => d.id === q.get("dir"))) state.dir = q.get("dir");
  if (FEMALE_KINDS.some(k => k.id === q.get("kind"))) state.kindF = q.get("kind");
  if (OUTFIT_STYLES.some(s => s.id === q.get("ostyle"))) state.outfitStyle = q.get("ostyle");
  for (const s of ["top", "bottom", "shoes"]) {
    const v = q.get(s);
    if ((v === "on" || v === "off") && !(s === "top" && v === "off")) state.outfitF[s] = v;
    if (GARMENT_COLORS.some(c => c.id === v)) state.outfitM[s] = v;
  }
  state.outfitF.top = "on";
  if (q.get("name")) { state.name = q.get("name").slice(0, 12); document.getElementById("nameInput").value = state.name; }
  if (WEAPONS.some(w => w.id === q.get("weapon"))) state.weapon = q.get("weapon");
  if (q.get("atk") === "1") state.attack = true;
  if (q.get("cat")) openCat = q.get("cat");
})();
refreshAll();
</script>

  var PHRASES = Object.keys(L10N).sort(function (a, b) { return b.length - a.length; });

    ['#randomBtn', 'title', 'Random'],
    ['#resetBtn', 'title', 'Reset'],
    ['#spinBtn', 'title', 'Auto-rotate'],

  snapStatic();

      '#espil-lang-toggle button{flex:1;padding:6px 0;border-radius:8px;border:1.5px solid #d9b380;background:#fffdf6;color:#8a6a3b;font:700 .72rem/1 "Manrope",sans-serif;letter-spacing:.08em;cursor:pointer}' +

    var panel = document.getElementById('panel');
    if (panel) {

      var title = panel.querySelector('.panel-title');

          try { refreshAll(); } catch (e) {}

  applyLang(custLang);
  var OUTFIT_STYLE_IDS = ['default', 'outfit2', 'armor1', 'armor2', 'robe1'];
  var WEAPON_IDS = ['none', 'guard', 'greatsword', 'bow', 'staff', 'dagger'];
  function readRec() { try { return JSON.parse(localStorage.getItem('espil_character') || 'null'); } catch (e) { return null; } }

    var rec = readRec();
    if (rec && rec.look2) {
      var L = rec.look2;
      if (L.gender === 'male' || L.gender === 'female') state.gender = L.gender;
      if (L.skin && SKINS.some(function (s) { return s.id === L.skin; })) state.skin = L.skin;
      if (L.hair) { state.hairStyle = L.hair.style || 'default'; state.hairColor = L.hair.color || 'original'; }
      if (L.eyes) { state.eyeStyle = L.eyes.style || 'default'; state.eyeColor = L.eyes.color || 'original'; }
      if (L.outfit) {
        if (OUTFIT_STYLE_IDS.indexOf(L.outfit.style) >= 0) state.outfitStyle = L.outfit.style;
        if (state.gender === 'female') {
          state.kindF = L.outfit.kind || 'original';
          state.outfitF.bottom = L.outfit.bottom === 'off' ? 'off' : 'on';
          state.outfitF.shoes = L.outfit.shoes === 'off' ? 'off' : 'on';
        } else {
          state.outfitM.top = L.outfit.top || 'original';
          state.outfitM.bottom = L.outfit.bottom || 'original';
          state.outfitM.shoes = L.outfit.shoes || 'original';
        }
      }
      if (WEAPON_IDS.indexOf(L.weapon) >= 0) state.weapon = L.weapon;
      if (L.name) { state.name = L.name; var ni = document.getElementById('nameInput'); if (ni) ni.value = L.name; }
      refreshAll();
    } else if (rec && (rec.gender === 'male' || rec.gender === 'female')) {
      state.gender = rec.gender;
      var SK2 = ['light', 'default', 'default', 'deep', 'deep'];

      refreshAll();

  } catch (e) {}
  if (!FROM) return;
  function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

    var best = dflt, bd = 1e12;
    list.forEach(function (c, i) { if (!c.rgb) return; var d = Math.pow(c.rgb[0] - rgb[0], 2) + Math.pow(c.rgb[1] - rgb[1], 2) + Math.pow(c.rgb[2] - rgb[2], 2); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  var HC = ['#3a2a1c', '#7a4a2b', '#b3764a', '#e3c188', '#ececec', '#23262b', '#c94f4f', '#4a6ac9', '#5da873'].map(function (h) { return { rgb: hexRgb(h) }; });
  var OF = ['#3f7fbf', '#c94f4f', '#57a773', '#e0a83c', '#7a5fc0', '#e77fc0', '#37b8a5', '#e8e4da'].map(function (h) { return { rgb: hexRgb(h) }; });
  function mappedLook() {
    var skinIdx = { light: 0, default: 1, deep: 3 }[state.skin];
    var hairIdx = ['default', 'hair2', 'hair3', 'hair4'].indexOf(state.hairStyle);
    var hc = null, ofIdx = 0;
    for (var i = 0; i < HAIR_COLORS.length; i++) if (HAIR_COLORS[i].id === state.hairColor) hc = HAIR_COLORS[i];

      var kind = null;
      for (var j = 0; j < FEMALE_KINDS.length; j++) if (FEMALE_KINDS[j].id === state.kindF) kind = FEMALE_KINDS[j];

      var top = null;
      for (var k = 0; k < GARMENT_COLORS.length; k++) if (GARMENT_COLORS[k].id === state.outfitM.top) top = GARMENT_COLORS[k];

  }

    return {
      spec: 'zealandia-customizer v0.2',
      name: state.name,
      gender: state.gender,
      skin: state.skin,
      hair: { style: state.hairStyle, color: state.hairColor },
      eyes: { style: state.eyeStyle, color: state.eyeColor },
      cosmetics: 'none',
      outfit: state.gender === 'female'

      hat: 'none',
      accessory: 'none',
      weapon: state.weapon,
      directions: ['S', 'E', 'N', 'W'],

  }
  /* Han 2026-11-02: the created character is registered to the

  function registerToAccount(rec) {
    try {
      var ses = JSON.parse(localStorage.getItem('espil_session_v1') || 'null');

      accs[key].look = rec.look;

})();
