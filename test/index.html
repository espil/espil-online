<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#081313" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <title>게임 컨트롤 시스템</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #e9f3ef;
      --ink: #10201f;
      --muted: #536c68;
      --panel: rgba(247, 252, 249, .93);
      --panel-solid: #f7fcf9;
      --line: rgba(15, 67, 61, .16);
      --line-strong: rgba(15, 67, 61, .32);
      --mint: #31e6b2;
      --mint-deep: #087b64;
      --cyan: #4ad8ff;
      --orange: #ff9e5b;
      --red: #ff687f;
      --yellow: #ffd75d;
      --arena-1: #dcece7;
      --arena-2: #cde3dc;
      --shadow: 0 18px 60px rgba(10, 48, 43, .15);
      --key-bg: #ecf7f2;
      --empty: rgba(58, 97, 91, .07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071111;
        --ink: #e9fff8;
        --muted: #8eaaa4;
        --panel: rgba(9, 25, 24, .92);
        --panel-solid: #0a1a19;
        --line: rgba(119, 238, 207, .14);
        --line-strong: rgba(119, 238, 207, .3);
        --mint: #4cf0bd;
        --mint-deep: #59e6bd;
        --arena-1: #0c1f1d;
        --arena-2: #09201c;
        --shadow: 0 22px 70px rgba(0, 0, 0, .46);
        --key-bg: #102c28;
        --empty: rgba(157, 228, 208, .055);
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans KR", sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    .app {
      min-height: 100dvh;
      height: 100dvh;
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }
    .arena {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, transparent 0 34%, rgba(10, 74, 64, .04) 72%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        linear-gradient(145deg, var(--arena-1), var(--arena-2));
      background-size: auto, 64px 64px, 64px 64px, auto;
    }
    .arena::before {
      content: "";
      position: absolute;
      width: 62vmin; height: 62vmin;
      left: 50%; top: 48%; transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 50%;
      box-shadow: 0 0 0 8vmin rgba(67, 229, 183, .025), 0 0 0 18vmin rgba(67, 229, 183, .018);
    }
    .arena::after {
      content: "MOVE TEST FIELD";
      position: absolute;
      left: 50%; top: calc(48% + 36vmin);
      transform: translateX(-50%);
      font: 700 10px/1 "JetBrains Mono", monospace;
      letter-spacing: .24em;
      color: var(--muted);
      opacity: .45;
      white-space: nowrap;
    }
    .player {
      position: absolute;
      width: 58px; height: 70px;
      left: 50%; top: 46%;
      transform: translate(-50%, -50%);
      will-change: left, top, transform;
      z-index: 3;
      filter: drop-shadow(0 10px 7px rgba(0,0,0,.2));
    }
    .player .body {
      position: absolute; inset: 12px 5px 4px;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(145deg, #effff9 0 44%, #a4e7d4 45% 100%);
      border: 2px solid rgba(8, 71, 61, .55);
      transition: filter .1s, transform .12s;
    }
    .player.moving .body { animation: waddle .34s ease-in-out infinite alternate; }
    @keyframes waddle { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(-3px); } }
    .player .eye { position:absolute; top: 16px; width: 5px; height: 7px; background:#0e2926; border-radius:50%; z-index:2; }
    .player .eye.l { left:20px; } .player .eye.r { right:20px; }
    .player .core { position:absolute; width: 15px; height: 15px; border-radius: 50%; left: 50%; top: 37px; transform: translateX(-50%); background: var(--mint); box-shadow: 0 0 17px var(--mint); z-index: 2; }
    .player .shadow { position:absolute; width:46px; height:12px; border-radius:50%; left:6px; bottom:-5px; background:rgba(0,0,0,.17); z-index:-1; filter: blur(2px); }
    .cast-label {
      position: absolute;
      left: 50%; top: -22px; transform: translateX(-50%) translateY(5px);
      color: #fff; background: #0b2320; border: 1px solid rgba(255,255,255,.2);
      padding: 4px 8px; border-radius: 5px;
      font: 700 11px/1 "JetBrains Mono", monospace;
      white-space: nowrap; opacity: 0; pointer-events:none;
    }
    .player.casting .cast-label { animation: castLabel .65s ease both; }
    .player.casting .body { animation: castPulse .42s ease both; }
    @keyframes castLabel { 0%{opacity:0;transform:translateX(-50%) translateY(6px)} 20%,65%{opacity:1;transform:translateX(-50%) translateY(0)} 100%{opacity:0;transform:translateX(-50%) translateY(-10px)} }
    @keyframes castPulse { 0%{filter:brightness(1)} 35%{filter:brightness(1.8) saturate(1.4);transform:scale(1.12)} 100%{filter:brightness(1);transform:scale(1)} }
    .cast-ring { position:absolute; inset:-18px; border-radius:50%; border:3px solid var(--effect, var(--mint)); opacity:0; }
    .player.casting .cast-ring { animation:ring .55s ease-out; }
    @keyframes ring { from{opacity:.9;transform:scale(.45)} to{opacity:0;transform:scale(1.35)} }

    .hud-top {
      position:absolute; left:max(18px, env(safe-area-inset-left)); right:max(18px, env(safe-area-inset-right)); top:max(16px, env(safe-area-inset-top));
      display:flex; justify-content:space-between; align-items:flex-start; z-index:20; pointer-events:none;
    }
    .mode-card { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:9px; backdrop-filter: blur(14px); }
    .live-dot { width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint); }
    .mode-copy strong { display:block;font-size:12px;line-height:1.1; }
    .mode-copy span { display:block;font:500 9px/1.4 "JetBrains Mono",monospace;color:var(--muted);margin-top:3px;letter-spacing:.05em; }
    .top-actions { display:flex; gap:8px; pointer-events:auto; }
    .icon-btn { width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer; }
    .icon-btn:hover { border-color:var(--line-strong); }
    .icon-btn svg { width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8; }

    .desktop-hint {
      position:absolute; left:50%; top:max(17px, env(safe-area-inset-top)); transform:translateX(-50%); z-index:15;
      display:flex; align-items:center; gap:10px; color:var(--muted); font-size:11px;
    }
    .keys { display:grid;grid-template-columns:repeat(3,23px);gap:3px; }
    .keycap { height:23px;display:grid;place-items:center;border:1px solid var(--line-strong);border-bottom-width:3px;border-radius:5px;background:var(--key-bg);font:700 10px "JetBrains Mono",monospace;color:var(--ink); }
    .keycap.up { grid-column:2; }.keycap.left{grid-column:1}.keycap.down{grid-column:2}.keycap.right{grid-column:3}

    .hotbar {
      position:absolute; z-index:20; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%);
      display:grid; grid-template-columns:repeat(12, minmax(46px, 56px)); gap:5px;
      padding:8px; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); backdrop-filter:blur(16px);
    }
    .slot {
      position:relative; min-width:0; aspect-ratio:1; border:1px solid var(--line); border-radius:8px; padding:0; background:var(--empty); overflow:hidden; cursor:pointer; user-select:none;
      display:flex;align-items:center;justify-content:center;
    }
    .slot:hover, .slot.drag-over { border-color:var(--mint); background:rgba(49,230,178,.12); }
    .slot.active { animation:slotHit .28s ease; box-shadow:0 0 0 2px var(--effect, var(--mint)), 0 0 22px var(--effect, var(--mint)); }
    @keyframes slotHit { 50%{transform:translateY(-5px)} }
    .slot .key { position:absolute;top:4px;left:5px;font:700 10px/1 "JetBrains Mono",monospace;color:var(--muted);z-index:2; }
    .slot .icon { width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#071311;font-size:15px;font-weight:700;background:var(--skill-color,#627a75);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22); }
    .slot .name { position:absolute;bottom:3px;left:3px;right:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px;text-align:center;font-weight:600; }
    .slot.empty::after { content:"+";color:var(--muted);font:400 22px/1 sans-serif;opacity:.65; }
    .slot.empty .name { color:var(--muted); }
    .slot.item-slot { border-style:dashed; }
    .slot[draggable="true"] { cursor:grab; }

    .inventory {
      position:absolute; z-index:30; right:max(18px, env(safe-area-inset-right)); top:74px; width:min(340px, calc(100vw - 36px)); max-height:calc(100dvh - 180px);
      background:var(--panel-solid); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); overflow:hidden;
      transform-origin:top right; transition:opacity .18s, transform .18s; touch-action:pan-y;
    }
    .inventory.hidden { display:none; }
    .inv-head { display:flex;align-items:flex-start;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--line); }
    .inv-head h2 { margin:0;font-size:16px; }
    .inv-head p { margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.4; }
    .close { border:0;background:none;padding:2px;cursor:pointer;font-size:20px;line-height:1; }
    .inv-tabs { display:flex; gap:4px; padding:10px 12px 6px; }
    .tab { border:0;background:transparent;color:var(--muted);font-size:12px;padding:7px 10px;border-radius:6px;cursor:pointer; }
    .tab.selected { color:#062019;background:var(--mint);font-weight:700; }
    .inv-grid { display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:6px 12px 14px;max-height:47vh;overflow:auto; }
    .inv-card { display:flex;align-items:center;gap:9px;min-width:0;padding:9px;border:1px solid var(--line);background:var(--empty);border-radius:8px;cursor:grab;text-align:left; }
    .inv-card:hover { border-color:var(--line-strong); }
    .inv-card .mini { flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#071311;font-weight:700;background:var(--skill-color); }
    .inv-card strong { display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .inv-card small { display:block;color:var(--muted);font-size:9px;margin-top:2px; }
    .inv-note {padding:0 14px 14px;color:var(--muted);font-size:10px;line-height:1.45;}

    .toast { position:absolute;z-index:50;left:50%;top:90px;transform:translate(-50%,-8px);background:#091d1a;color:#eafff9;border:1px solid rgba(255,255,255,.12);padding:9px 13px;border-radius:7px;font-size:11px;opacity:0;pointer-events:none;transition:.2s; }
    .toast.show { opacity:1;transform:translate(-50%,0); }
    .joystick { display:none; position:absolute; z-index:18; left:max(20px, env(safe-area-inset-left)); bottom:max(30px, calc(env(safe-area-inset-bottom) + 18px)); width:128px;height:128px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(6,24,21,.2);box-shadow:inset 0 0 0 11px rgba(128,230,201,.05);touch-action:none; }
    .stick { position:absolute;width:55px;height:55px;border-radius:50%;left:36px;top:36px;background:var(--panel);border:2px solid var(--mint);box-shadow:0 8px 20px rgba(0,0,0,.22); }
    .joy-mark { position:absolute;inset:14px;opacity:.45; }
    .joy-mark::before,.joy-mark::after{content:"";position:absolute;background:var(--line-strong)}
    .joy-mark::before{left:50%;top:0;bottom:0;width:1px}.joy-mark::after{top:50%;left:0;right:0;height:1px}

    .help {
      position:absolute;inset:0;z-index:80;background:rgba(2,10,9,.58);display:grid;place-items:center;padding:22px;backdrop-filter:blur(8px);transition:.18s;
    }
    .help.hidden { display:none; }
    .help-card { width:min(560px,100%);background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px; }
    .help-card h2 {margin:0 0 16px;font-size:20px}.help-card p{color:var(--muted);font-size:13px;line-height:1.65;margin:0 0 18px}
    .help-list {display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.help-row{background:var(--empty);border-radius:7px;padding:10px 12px}.help-row strong{display:block;font-size:12px}.help-row span{font-size:10px;color:var(--muted)}
    .primary {width:100%;border:0;background:var(--mint);color:#062119;font-weight:700;padding:11px;border-radius:8px;cursor:pointer;}

    @media (max-width: 900px), (pointer: coarse) {
      .desktop-hint { display:none; }
      .joystick { display:block; }
      .hotbar {
        left:auto; right:max(14px, env(safe-area-inset-right)); transform:none; bottom:max(18px, env(safe-area-inset-bottom));
        grid-template-columns:repeat(3, 52px); grid-template-rows:repeat(4, 52px); gap:6px; padding:7px;
      }
      .slot { width:52px;height:52px;aspect-ratio:auto; }
      .slot .icon{width:30px;height:30px}.slot .key{font-size:9px}.slot .name{display:none}
      .arena::after { display:none; }
      .inventory { top:68px; max-height:calc(100dvh - 88px); }
      .inv-grid { max-height:55vh; }
    }
    @media (max-width: 480px) {
      .mode-card { padding:7px 9px; }.mode-copy span{display:none}.icon-btn{width:36px;height:36px}
      .hud-top {left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top))}
      .joystick{width:112px;height:112px;left:max(12px,env(safe-area-inset-left));bottom:max(26px,calc(env(safe-area-inset-bottom) + 12px))}
      .stick{width:49px;height:49px;left:31px;top:31px}
      .joy-mark{inset:12px}
      .hotbar{right:max(8px,env(safe-area-inset-right));grid-template-columns:repeat(3,44px);grid-template-rows:repeat(4,44px);gap:4px;padding:5px;bottom:max(12px,env(safe-area-inset-bottom))}
      .slot{width:44px;height:44px;border-radius:7px}.slot .icon{width:26px;height:26px;font-size:12px}.slot .key{font-size:8px;top:3px;left:4px}
      .player{width:51px;height:62px}
      .help-list{grid-template-columns:1fr}.help-card{padding:19px}
    }
    @media (max-width: 350px) {
      .joystick{width:98px;height:98px}.stick{left:27px;top:27px;width:43px;height:43px}
      .hotbar{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(4,40px)}.slot{width:40px;height:40px}
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="게임 컨트롤 테스트 필드">
    <section class="arena" id="arena" aria-label="캐릭터 이동 영역">
      <div class="player" id="player" role="img" aria-label="테스트 캐릭터">
        <div class="shadow"></div><div class="cast-ring"></div><div class="body"></div><i class="eye l"></i><i class="eye r"></i><i class="core"></i><div class="cast-label" id="castLabel">A</div>
      </div>
    </section>

    <header class="hud-top">
      <div class="mode-card"><i class="live-dot"></i><div class="mode-copy"><strong id="modeTitle">키보드 모드</strong><span id="modeDetail">ARROW MOVE · 12 HOTKEYS</span></div></div>
      <div class="top-actions">
        <button class="icon-btn" id="inventoryBtn" aria-label="인벤토리 열기" title="인벤토리">
          <svg viewBox="0 0 24 24"><path d="M5 7h14v13H5zM8 7V5a4 4 0 0 1 8 0v2M8 11h8M8 15h8"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" aria-label="조작법 보기" title="조작법">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.5 2.5 0 1 1 3.2 2.4c-.8.3-.9.9-.9 1.6M12 17h.01"/></svg>
        </button>
      </div>
    </header>

    <div class="desktop-hint" aria-label="방향키로 이동">
      <span>이동</span><div class="keys"><kbd class="keycap up">↑</kbd><kbd class="keycap left">←</kbd><kbd class="keycap down">↓</kbd><kbd class="keycap right">→</kbd></div><span>방향키 전용</span>
    </div>

    <div class="joystick" id="joystick" aria-label="가상 이동 조이스틱"><i class="joy-mark"></i><div class="stick" id="stick"></div></div>
    <div class="hotbar" id="hotbar" aria-label="스킬 단축키"></div>

    <aside class="inventory hidden" id="inventory" aria-label="스킬 인벤토리">
      <div class="inv-head"><div><h2>인벤토리</h2><p>드래그하거나 선택 후 슬롯을 눌러 장착</p></div><button class="close" id="closeInventory" aria-label="닫기">×</button></div>
      <div class="inv-tabs"><button class="tab selected" data-tab="skills">스킬</button><button class="tab" data-tab="items">아이템</button></div>
      <div class="inv-grid" id="invGrid"></div>
      <div class="inv-note" id="invNote">스킬은 QWER / ASDF 슬롯에 장착할 수 있어요. 장착된 스킬끼리 드래그하면 위치가 바뀝니다.</div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="help hidden" id="help" aria-modal="true" role="dialog" aria-labelledby="helpTitle">
      <div class="help-card">
        <h2 id="helpTitle">조작 시스템</h2>
        <p>키보드에서는 방향키만 이동에 사용합니다. 모바일과 콘솔은 왼쪽 조이스틱으로 움직이고, 오른쪽 버튼으로 스킬을 실행합니다.</p>
        <div class="help-list">
          <div class="help-row"><strong>ASDF · 1순위</strong><span>기본 스킬 자동 장착</span></div>
          <div class="help-row"><strong>QWER · 2순위</strong><span>보조 스킬 자동 장착</span></div>
          <div class="help-row"><strong>1234 · 아이템</strong><span>인벤토리에서 직접 장착</span></div>
          <div class="help-row"><strong>드래그 / 클릭</strong><span>슬롯 재배치 및 장착</span></div>
        </div>
        <button class="primary" id="closeHelp">테스트 시작</button>
      </div>
    </section>
  </main>

  <script>
  (function(){
    'use strict';
    var keys = ['1','2','3','4','q','w','e','r','a','s','d','f'];
    var skills = [
      {id:'pulse',name:'펄스',icon:'P',color:'#4cf0bd',type:'skill'},
      {id:'dash',name:'대시',icon:'D',color:'#4ad8ff',type:'skill'},
      {id:'guard',name:'가드',icon:'G',color:'#ffd75d',type:'skill'},
      {id:'nova',name:'노바',icon:'N',color:'#ff7ea4',type:'skill'},
      {id:'spark',name:'스파크',icon:'S',color:'#98e55f',type:'skill'},
      {id:'blink',name:'블링크',icon:'B',color:'#72a4ff',type:'skill'},
      {id:'wave',name:'웨이브',icon:'W',color:'#62dded',type:'skill'},
      {id:'orbit',name:'오비트',icon:'O',color:'#ff9e5b',type:'skill'},
      {id:'flare',name:'플레어',icon:'F',color:'#ff6c5f',type:'skill'},
      {id:'frost',name:'프로스트',icon:'I',color:'#88cfff',type:'skill'}
    ];
    var items = [
      {id:'potion',name:'회복 포션',icon:'+',color:'#ff687f',type:'item'},
      {id:'boost',name:'부스트 캔',icon:'↑',color:'#ffd75d',type:'item'},
      {id:'smoke',name:'연막탄',icon:'○',color:'#98aaa6',type:'item'},
      {id:'recall',name:'리콜 코어',icon:'R',color:'#8ba6ff',type:'item'},
      {id:'scanner',name:'스캐너',icon:'⌁',color:'#4cf0bd',type:'item'},
      {id:'shield',name:'실드 팩',icon:'◇',color:'#4ad8ff',type:'item'}
    ];
    var byId = {};
    skills.concat(items).forEach(function(x){ byId[x.id]=x; });
    var slots = {1:null,2:null,3:null,4:null,q:'spark',w:'blink',e:'wave',r:'orbit',a:'pulse',s:'dash',d:'guard',f:'nova'};
    var selected = null, activeTab='skills', dragSource=null;
    var hotbar=document.getElementById('hotbar'), player=document.getElementById('player'), arena=document.getElementById('arena');
    var castLabel=document.getElementById('castLabel'), toast=document.getElementById('toast'), inventory=document.getElementById('inventory'), invGrid=document.getElementById('invGrid');
    var position={x:50,y:46}, move={x:0,y:0}, pressed={}, last=performance.now(), castTimer, toastTimer;

    function allowed(item,key){ return item && ((key>='1'&&key<='4') ? item.type==='item' : item.type==='skill'); }
    function renderHotbar(){
      hotbar.innerHTML='';
      keys.forEach(function(key){
        var item=byId[slots[key]];
        var btn=document.createElement('button');
        btn.className='slot '+(item?'':'empty')+((key>='1'&&key<='4')?' item-slot':'');
        btn.dataset.key=key; btn.setAttribute('aria-label', item ? key.toUpperCase()+' '+item.name : key+' 빈 아이템 슬롯');
        btn.draggable=!!item;
        btn.innerHTML='<span class="key">'+key.toUpperCase()+'</span>'+(item?'<span class="icon" style="--skill-color:'+item.color+'">'+item.icon+'</span><span class="name">'+item.name+'</span>':'<span class="name">아이템</span>');
        btn.addEventListener('click',function(){
          if(selected){ equip(selected,key); }
          else if(item){ activate(key); }
        });
        btn.addEventListener('dragstart',function(e){ dragSource={kind:'slot',key:key}; e.dataTransfer.setData('text/plain','slot:'+key); });
        btn.addEventListener('dragover',function(e){e.preventDefault();btn.classList.add('drag-over');});
        btn.addEventListener('dragleave',function(){btn.classList.remove('drag-over');});
        btn.addEventListener('drop',function(e){ e.preventDefault();btn.classList.remove('drag-over');handleDrop(key); });
        hotbar.appendChild(btn);
      });
    }
    function renderInventory(){
      var list=activeTab==='skills'?skills:items;
      invGrid.innerHTML='';
      list.forEach(function(item){
        var b=document.createElement('button');b.className='inv-card';b.draggable=true;b.dataset.id=item.id;
        b.style.outline=selected===item.id?'2px solid var(--mint)':'none';
        b.innerHTML='<span class="mini" style="--skill-color:'+item.color+'">'+item.icon+'</span><span><strong>'+item.name+'</strong><small>'+(item.type==='skill'?'스킬 슬롯':'1–4 슬롯')+'</small></span>';
        b.addEventListener('dragstart',function(e){dragSource={kind:'inventory',id:item.id};e.dataTransfer.setData('text/plain','inv:'+item.id);});
        b.addEventListener('click',function(){selected=selected===item.id?null:item.id;renderInventory();showToast(selected?item.name+' 선택됨 · 슬롯을 누르세요':'선택 해제');});
        invGrid.appendChild(b);
      });
      document.getElementById('invNote').textContent=activeTab==='skills'?'스킬은 QWER / ASDF 슬롯에 장착할 수 있어요. 장착된 스킬끼리 드래그하면 위치가 바뀝니다.':'아이템은 숫자 1–4 슬롯에만 장착할 수 있어요.';
    }
    function equip(id,key){
      var item=byId[id];
      if(!allowed(item,key)){showToast(item.type==='item'?'아이템은 1–4 슬롯에 장착하세요':'스킬은 QWER / ASDF 슬롯에 장착하세요');return;}
      var priorKey=keys.find(function(k){return slots[k]===id;});
      if(priorKey) slots[priorKey]=slots[key];
      slots[key]=id;selected=null;renderHotbar();renderInventory();showToast(key.toUpperCase()+' 슬롯에 '+item.name+' 장착');
    }
    function handleDrop(target){
      if(!dragSource)return;
      if(dragSource.kind==='inventory') equip(dragSource.id,target);
      else {
        var source=dragSource.key, src=byId[slots[source]], dst=byId[slots[target]];
        if(!src || !allowed(src,target) || (dst && !allowed(dst,source))){showToast('같은 종류의 슬롯끼리 이동할 수 있어요');dragSource=null;return;}
        var tmp=slots[target];slots[target]=slots[source];slots[source]=tmp;renderHotbar();showToast(source.toUpperCase()+' ↔ '+target.toUpperCase()+' 위치 변경');
      }
      dragSource=null;
    }
    function activate(key){
      var id=slots[key], item=byId[id]; if(!item){showToast(key+' 슬롯이 비어 있어요');return;}
      var slot=hotbar.querySelector('[data-key="'+key+'"]');
      if(slot){slot.style.setProperty('--effect',item.color);slot.classList.remove('active');void slot.offsetWidth;slot.classList.add('active');}
      player.style.setProperty('--effect',item.color);castLabel.textContent=key.toUpperCase()+' · '+item.name;player.classList.remove('casting');void player.offsetWidth;player.classList.add('casting');
      clearTimeout(castTimer);castTimer=setTimeout(function(){player.classList.remove('casting');},700);
    }
    function showToast(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(function(){toast.classList.remove('show');},1600);}

    window.addEventListener('keydown',function(e){
      var k=e.key.toLowerCase();
      if(['arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0){e.preventDefault();pressed[k]=true;}
      else if(keys.indexOf(k)>=0 && !e.repeat){e.preventDefault();activate(k);}
      else if((k==='i'||k==='escape')&&!e.repeat){if(k==='i')toggleInventory();else closePanels();}
    });
    window.addEventListener('keyup',function(e){pressed[e.key.toLowerCase()]=false;});
    window.addEventListener('blur',function(){pressed={};move.x=move.y=0;});

    function frame(now){
      var dt=Math.min((now-last)/1000,.035);last=now;
      var kx=(pressed.arrowright?1:0)-(pressed.arrowleft?1:0), ky=(pressed.arrowdown?1:0)-(pressed.arrowup?1:0);
      pollGamepad();
      var x=kx||move.x,y=ky||move.y,len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}
      if(Math.abs(x)>.03||Math.abs(y)>.03){position.x=Math.max(4,Math.min(96,position.x+x*22*dt));position.y=Math.max(9,Math.min(90,position.y+y*22*dt));player.classList.add('moving');if(x<-.03)player.style.setProperty('scale','-1 1');else if(x>.03)player.style.setProperty('scale','1 1');}
      else player.classList.remove('moving');
      player.style.left=position.x+'%';player.style.top=position.y+'%';requestAnimationFrame(frame);
    }

    var joystick=document.getElementById('joystick'),stick=document.getElementById('stick'),joyPointer=null;
    function joyUpdate(e){var r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.28,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max;}move.x=dx/max;move.y=dy/max;stick.style.transform='translate('+dx+'px,'+dy+'px)';}
    joystick.addEventListener('pointerdown',function(e){joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joyUpdate(e);});
    joystick.addEventListener('pointermove',function(e){if(e.pointerId===joyPointer)joyUpdate(e);});
    function joyEnd(e){if(e.pointerId!==joyPointer)return;joyPointer=null;move.x=move.y=0;stick.style.transform='translate(0,0)';}
    joystick.addEventListener('pointerup',joyEnd);joystick.addEventListener('pointercancel',joyEnd);

    var gamepadButtons=[];
    function pollGamepad(){
      var gps=navigator.getGamepads?navigator.getGamepads():[];var gp=null;for(var i=0;i<gps.length;i++){if(gps[i]){gp=gps[i];break;}}
      if(!gp)return;
      var ax=Math.abs(gp.axes[0]||0)>.15?gp.axes[0]:0,ay=Math.abs(gp.axes[1]||0)>.15?gp.axes[1]:0;move.x=ax;move.y=ay;
      for(var b=0;b<Math.min(12,gp.buttons.length);b++){var down=gp.buttons[b].pressed;if(down&&!gamepadButtons[b])activate(keys[b]);gamepadButtons[b]=down;}
    }
    window.addEventListener('gamepadconnected',function(){document.body.classList.add('gamepad');document.getElementById('modeTitle').textContent='콘솔 모드';document.getElementById('modeDetail').textContent='STICK MOVE · 12 BUTTONS';showToast('게임패드 연결됨');});
    window.addEventListener('gamepaddisconnected',function(){detectMode();});
    function detectMode(){var touch=matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0;document.getElementById('modeTitle').textContent=touch?'터치 모드':'키보드 모드';document.getElementById('modeDetail').textContent=touch?'JOYSTICK MOVE · TOUCH SKILLS':'ARROW MOVE · 12 HOTKEYS';}

    function toggleInventory(){inventory.classList.toggle('hidden');if(!inventory.classList.contains('hidden'))renderInventory();}
    function closePanels(){inventory.classList.add('hidden');document.getElementById('help').classList.add('hidden');}
    document.getElementById('inventoryBtn').addEventListener('click',toggleInventory);
    document.getElementById('closeInventory').addEventListener('click',function(){inventory.classList.add('hidden');});
    document.getElementById('helpBtn').addEventListener('click',function(){document.getElementById('help').classList.remove('hidden');});
    document.getElementById('closeHelp').addEventListener('click',function(){document.getElementById('help').classList.add('hidden');});
    document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){activeTab=tab.dataset.tab;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('selected',x===tab);});selected=null;renderInventory();});});

    renderHotbar();renderInventory();detectMode();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
