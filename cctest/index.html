<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Customization Test</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:sans-serif; background:#1a1a2e; color:#eee; overflow:hidden; }
  #app { display:flex; height:100vh; }
  #preview {
    flex:1; display:flex; align-items:center; justify-content:center;
    background:repeating-conic-gradient(#222 0% 25%, #1a1a1a 0% 50%) 50% / 40px 40px;
  }
  #preview .placeholder { color:#555; font-size:14px; }
  #panel {
    width:300px; background:rgba(20,20,35,0.95);
    border-left:1px solid rgba(255,255,255,0.1); padding:16px;
  }
  #panel h2 { font-size:15px; margin-bottom:12px; }
  #panel p { font-size:12px; color:#888; }
  @media (max-width:640px) { #panel { width:220px; } }
</style>
</head>
<body>
<div id="app">
  <div id="preview">
    <div class="placeholder">character preview</div>
  </div>
  <div id="panel">
    <h2>Character Custom</h2>
    <p>cctest — work in progress</p>
  </div>
</div>
</body>
</html>
