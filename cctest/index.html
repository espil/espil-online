<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 커스텀</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:sans-serif; background:#1a1a2e; color:#eee; overflow:hidden; }
  #app { display:flex; height:100vh; }
  #stage {
    flex:1; display:flex; align-items:center; justify-content:center;
    background:repeating-conic-gradient(#222 0% 25%, #1a1a1a 0% 50%) 50% / 40px 40px;
    position:relative; overflow:hidden;
  }
  #char {
    position:relative; width:min(70vw, 340px); aspect-ratio:969/1690;
    transform-style:preserve-3d;
  }
  #char img { position:absolute; pointer-events:none; }
  #img-body { z-index:1; left:0; top:0; width:100%; height:100%; object-fit:contain; }
  #img-hair { z-index:3; left:50%; top:-2%; width:62%; transform:translateX(-50%); }
  #img-eyes { z-index:2; left:50%; top:16.5%; width:34%; transform:translateX(-50%); }
  #shadow {
    position:absolute; bottom:6%; left:50%; transform:translateX(-50%);
    width:55%; height:24px; z-index:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, transparent 70%);
    border-radius:50%;
  }
  #nametag {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); color:#fff; padding:6px 18px; border-radius:14px;
    font-size:15px; font-weight:bold; z-index:10;
  }
  #panel {
    width:300px; background:rgba(20,20,35,0.95);
    border-left:1px solid rgba(255,255,255,0.1);
    display:flex; flex-direction:column; z-index:10;
  }
  #tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.1); }
  #tabs button {
    flex:1; background:none; border:none; color:#888; padding:14px;
    font-size:15px; cursor:pointer; border-bottom:2px solid transparent;
  }
  #tabs button.active { color:#fff; border-bottom-color:#0e6e6e; }
  #tab-content { flex:1; overflow-y:auto; padding:12px; }
  .section-label { font-size:12px; color:#888; margin:12px 0 8px; }
  .section-label:first-child { margin-top:0; }
  .style-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .style-btn {
    background:rgba(255,255,255,0.07); border:2px solid transparent; border-radius:10px;
    padding:8px 4px; cursor:pointer; color:#ddd; font-size:11px; text-align:center;
  }
  .style-btn.active { border-color:#0e6e6e; background:rgba(14,110,110,0.25); }
  .thumb { width:100%; height:44px; object-fit:contain; margin-bottom:2px; }
  @media (max-width:640px) {
    #panel { width:200px; }
    #char { width:min(58vw, 280px); }
    .style-grid { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="nametag">Espil</div>
    <div id="char">
      <div id="shadow"></div>
      <img id="img-body" src="/cctest/assets/body_base.png" alt="">
      <img id="img-eyes" src="/cctest/assets/eye_f1_big.png" alt="">
      <img id="img-hair" src="/cctest/assets/hair_m1_spiky.png" alt="">
    </div>
  </div>
  <div id="panel">
    <div id="tabs">
      <button data-tab="hair" class="active">헤어</button>
      <button data-tab="eyes">눈</button>
    </div>
    <div id="tab-content">
      <div id="tab-hair">
        <div class="section-label">남성</div>
        <div class="style-grid" id="hair-m"></div>
        <div class="section-label">여성</div>
        <div class="style-grid" id="hair-f"></div>
      </div>
      <div id="tab-eyes" style="display:none;">
        <div class="section-label">남성</div>
        <div class="style-grid" id="eye-m"></div>
        <div class="section-label">여성</div>
        <div class="style-grid" id="eye-f"></div>
      </div>
    </div>
  </div>
</div>
<script>
const HAIRS = {
  m1:['스파이키','hair_m1_spiky'], m2:['단정한숏','hair_m2_neat'],
  m3:['내추럴','hair_m3_messy'], m4:['옆머리','hair_m4_swept'],
  m5:['와일드','hair_m5_wild'],
  f1:['단발','hair_f1_bob'], f2:['긴생머리','hair_f2_long'],
  f3:['트윈테일','hair_f3_twintail'], f4:['포니테일','hair_f4_ponytail'],
  f5:['웨이브','hair_f5_wavy'],
};
const EYES = {
  m1:['시크','eye_m1_cool'], m2:['순한','eye_m2_gentle'],
  m3:['의지','eye_m3_determined'], m4:['밝은','eye_m4_bright'],
  m5:['나른','eye_m5_sleepy'], m6:['진지','eye_m6_serious'],
  m7:['장난','eye_m7_playful'],
  f1:['왕눈이','eye_f1_big'], f2:['순한','eye_f2_gentle'],
  f3:['반짝이','eye_f3_sparkle'], f4:['고양이','eye_f4_cat'],
  f5:['처진눈','eye_f5_droopy'], f6:['밝은','eye_f6_bright'],
  f7:['수줍은','eye_f7_shy'],
};
let curH='m1', curE='f1';
const $ = id => document.getElementById(id);

function buildGrid(elId, data, cur, onPick) {
  const c = $(elId); c.innerHTML='';
  for (const [k,[name,file]] of Object.entries(data)) {
    if (!k.startsWith(elId.includes('hair')?'':'')) {}
    const b = document.createElement('div');
    b.className = 'style-btn'+(k===cur?' active':'');
    b.innerHTML = `<img class="thumb" src="/cctest/assets/t_${file}.png"><div>${name}</div>`;
    b.onclick = ()=>{ onPick(k); buildGrid(elId, data, k, onPick); };
    c.appendChild(b);
  }
}
function refreshAll() {
  const hm={}, hf={}, em={}, ef={};
  for (const [k,v] of Object.entries(HAIRS)) (k[0]==='m'?hm:hf)[k]=v;
  for (const [k,v] of Object.entries(EYES)) (k[0]==='m'?em:ef)[k]=v;
  buildGrid('hair-m', hm, curH, k=>{ curH=k; $('img-hair').src=`/cctest/assets/${HAIRS[k][1]}.png`; });
  buildGrid('hair-f', hf, curH, k=>{ curH=k; $('img-hair').src=`/cctest/assets/${HAIRS[k][1]}.png`; });
  buildGrid('eye-m', em, curE, k=>{ curE=k; $('img-eyes').src=`/cctest/assets/${EYES[k][1]}.png`; });
  buildGrid('eye-f', ef, curE, k=>{ curE=k; $('img-eyes').src=`/cctest/assets/${EYES[k][1]}.png`; });
}
document.querySelectorAll('#tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $('tab-hair').style.display = b.dataset.tab==='hair'?'':'none';
    $('tab-eyes').style.display = b.dataset.tab==='eyes'?'':'none';
  };
});
refreshAll();

// 2.5D tilt: subtle 3D rotation following pointer
const stage = $('stage'), charEl = $('char');
let tiltX = 0, tiltY = 0, targetTX = 0, targetTY = 0;
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5;
  const py = (e.clientY - r.top) / r.height - 0.5;
  targetTY = px * 10; targetTX = -py * 8;
});
stage.addEventListener('pointerleave', () => { targetTX = 0; targetTY = 0; });
(function tiltLoop(){
  tiltX += (targetTX - tiltX) * 0.08;
  tiltY += (targetTY - tiltY) * 0.08;
  const bobY = Math.sin(Date.now()/1000 * 2.6) * -5;
  charEl.style.transform = `translateY(${bobY}px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
  requestAnimationFrame(tiltLoop);
})();
</script>
</body>
</html>
