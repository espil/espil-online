<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Custom — Hybrid 2.5D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:sans-serif; overflow:hidden; background:#1a1a2e; }
  #canvas-wrap { position:fixed; inset:0; }
  #canvas-wrap canvas { display:block; }
  #nametag {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); color:#fff; padding:6px 18px; border-radius:14px;
    font-size:15px; font-weight:bold; pointer-events:none; z-index:10;
  }
  #anims { position:fixed; top:16px; left:16px; z-index:10; display:flex; gap:6px; }
  #anims button {
    background:rgba(255,255,255,0.12); color:#ddd; border:1px solid rgba(255,255,255,0.2);
    border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px; backdrop-filter:blur(4px);
  }
  #anims button.active { background:#0e6e6e; color:#fff; border-color:#0e6e6e; }
  #panel {
    position:fixed; top:0; right:0; width:300px; height:100%;
    background:rgba(20,20,35,0.92); backdrop-filter:blur(8px);
    border-left:1px solid rgba(255,255,255,0.1); z-index:10;
    display:flex; flex-direction:column; color:#eee;
  }
  #tabs { display:flex; border-bottom:1px solid rgba(255,255,255,0.1); }
  #tabs button {
    flex:1; background:none; border:none; color:#888; padding:14px;
    font-size:15px; cursor:pointer; border-bottom:2px solid transparent;
  }
  #tabs button.active { color:#fff; border-bottom-color:#0e6e6e; }
  #tab-content { flex:1; overflow-y:auto; padding:16px; }
  .section-label { font-size:12px; color:#888; margin:14px 0 8px; }
  .section-label:first-child { margin-top:0; }
  .style-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .style-btn {
    background:rgba(255,255,255,0.07); border:2px solid transparent; border-radius:10px;
    padding:10px 4px; cursor:pointer; color:#ddd; font-size:12px; text-align:center;
  }
  .style-btn.active { border-color:#0e6e6e; background:rgba(14,110,110,0.25); }
  .thumb { width:100%; height:48px; object-fit:contain; margin-bottom:4px; }
  @media (max-width:640px) { #panel { width:220px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="nametag">Espil</div>
<div id="anims">
  <button data-anim="tpose" class="active">T-포즈</button>
  <button data-anim="idle">Idle</button>
  <button data-anim="walk">걷기</button>
</div>
<div id="panel">
  <div id="tabs">
    <button data-tab="hair" class="active">헤어</button>
    <button data-tab="eyes">눈</button>
  </div>
  <div id="tab-content">
    <div id="tab-hair">
      <div class="section-label">남성</div>
      <div class="style-grid" id="hair-m"></div>
      <div class="section-label">여성</div>
      <div class="style-grid" id="hair-f"></div>
    </div>
    <div id="tab-eyes" style="display:none;">
      <div class="section-label">남성</div>
      <div class="style-grid" id="eye-m"></div>
      <div class="section-label">여성</div>
      <div class="style-grid" id="eye-f"></div>
    </div>
  </div>
</div>
<script>
// Hybrid 2.5D: 3D rigged base + 2D sprite overlays pinned to bones
const EYE_L = [-0.2273, 1.2773, 0.3066], EYE_R = [0.2280, 1.2773, 0.3007];
const HEAD_C = [0.0003, 1.2936, -0.0011];

const HAIRS = {
  m1: {name:'스파이키', front:'assets/hair_m1_spiky.png'},
  m2: {name:'단정한숏', front:'assets/hair_m2_neat.png'},
  m3: {name:'내추럴', front:'assets/hair_m3_messy.png'},
  m4: {name:'옆머리', front:'assets/hair_m4_swept.png'},
  m5: {name:'와일드', front:'assets/hair_m5_wild.png'},
  f1: {name:'단발', front:'assets/hair_f1_bob.png'},
  f2: {name:'긴생머리', front:'assets/hair_f2_long.png'},
  f3: {name:'트윈테일', front:'assets/hair_f3_twintail.png'},
  f4: {name:'포니테일', front:'assets/hair_f4_ponytail.png'},
  f5: {name:'웨이브', front:'assets/hair_f5_wavy.png'},
};
const EYES = {
  m1: {name:'시크', front:'assets/eye_m1_cool.png'},
  m2: {name:'순한', front:'assets/eye_m2_gentle.png'},
  m3: {name:'의지', front:'assets/eye_m3_determined.png'},
  m4: {name:'밝은', front:'assets/eye_m4_bright.png'},
  m5: {name:'나른', front:'assets/eye_m5_sleepy.png'},
  m6: {name:'진지', front:'assets/eye_m6_serious.png'},
  m7: {name:'장난', front:'assets/eye_m7_playful.png'},
  f1: {name:'왕눈이', front:'assets/eye_f1_big.png'},
  f2: {name:'순한', front:'assets/eye_f2_gentle.png'},
  f3: {name:'반짝이', front:'assets/eye_f3_sparkle.png'},
  f4: {name:'고양이', front:'assets/eye_f4_cat.png'},
  f5: {name:'처진눈', front:'assets/eye_f5_droopy.png'},
  f6: {name:'밝은', front:'assets/eye_f6_bright.png'},
  f7: {name:'수줍은', front:'assets/eye_f7_shy.png'},
};
const EYE_COLORS = {};

let curHair='m1', curEye='f1', curEyeColor='f1';
let hairSprite=null, eyeSprite=null, curView='front';

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.1, 3.2);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.minDistance = 1.2; controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.55;

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 0.8));
const key = new THREE.DirectionalLight(0xfff2e6, 1.0);
key.position.set(3,6,5); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdde8ff, 0.45);
fill.position.set(-4,3,3); scene.add(fill);

const ground = new THREE.Mesh(new THREE.CircleGeometry(4,48),
  new THREE.ShadowMaterial({opacity:0.3}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

const texLoader = new THREE.TextureLoader();
const texCache = {};
function tex(path) {
  if (!texCache[path]) {
    const t = texLoader.load(path);
    t.encoding = THREE.sRGBEncoding;
    texCache[path] = t;
  }
  return texCache[path];
}

let model, mixer, walkClip, headBone;
let bindPose = new Map();
let animMode = 'tpose';

new THREE.GLTFLoader().load('assets/character.glb', (gltf) => {
  model = gltf.scene; scene.add(model);
  model.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      if (o.material && o.material.isMeshStandardMaterial) {
        o.material.color.setHex(0xf2c9a8); o.material.roughness = 0.65;
      }
    }
    if (o.isBone) bindPose.set(o, {pos:o.position.clone(), quat:o.quaternion.clone()});
  });
  headBone = model.getObjectByName('mixamorig:Head');
  mixer = new THREE.AnimationMixer(model);
  if (gltf.animations.length) walkClip = gltf.animations[0];
  buildHair(curHair);
  buildEyes(curEye, curEyeColor);
  setAnim('tpose');
  animate();
}, undefined, (e)=>console.error(e));

// --- 2D sprite overlays attached to head bone (V2 proven approach) ---
function makeSpritePlane(w, h, texture) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({map:texture, transparent:true, depthWrite:false})
  );
  m.renderOrder = 10;
  return m;
}

function buildHair(style) {
  curHair = style;
  if (hairSprite && headBone) headBone.remove(hairSprite);
  else if (hairSprite) scene.remove(hairSprite);
  const t = tex(HAIRS[style].front);
  hairSprite = makeSpritePlane(1.1, 1.1, t);
  hairSprite.position.set(HEAD_C[0], HEAD_C[1]+0.03, 0.37);
  hairSprite.renderOrder = 11;
  scene.add(hairSprite);
  hairSprite.updateMatrixWorld(true);
  if (headBone) headBone.attach(hairSprite);
  refreshHairUI();
}

function buildEyes(style, color) {
  curEye = style;
  if (eyeSprite && headBone) headBone.remove(eyeSprite);
  else if (eyeSprite) scene.remove(eyeSprite);
  const t = tex(EYES[style].front);
  eyeSprite = makeSpritePlane(0.62, 0.185, t);
  eyeSprite.position.set(HEAD_C[0], HEAD_C[1]-0.02, 0.36);
  eyeSprite.renderOrder = 10;
  scene.add(eyeSprite);
  eyeSprite.updateMatrixWorld(true);
  if (headBone) headBone.attach(eyeSprite);
  refreshEyeUI();
}

// updateSprites disabled for V4 - using bone attach instead
function updateSprites() {}

// --- animations ---
function setAnim(mode) {
  animMode = mode;
  document.querySelectorAll('#anims button').forEach(b =>
    b.classList.toggle('active', b.dataset.anim===mode));
  if (!mixer) return;
  mixer.stopAllAction();
  if (mode==='walk' && walkClip) mixer.clipAction(walkClip).play();
  else bindPose.forEach((v,bone)=>{ bone.position.copy(v.pos); bone.quaternion.copy(v.quat); });
}
const clock = new THREE.Clock();
const _q = new THREE.Quaternion();
const _X = new THREE.Vector3(1,0,0), _Z = new THREE.Vector3(0,0,1);
function sway(bone, axis, amp, phase, t) {
  if (!bone) return;
  const b = bindPose.get(bone);
  bone.position.copy(b.pos); bone.quaternion.copy(b.quat);
  _q.setFromAxisAngle(axis, Math.sin(t*2.2+phase)*amp);
  bone.quaternion.multiply(_q);
}
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (mixer) mixer.update(dt);
  if (animMode==='idle' && model) {
    const get = n => model.getObjectByName(n);
    const h = get('mixamorig:Hips');
    if (h) {
      const b = bindPose.get(h);
      h.position.copy(b.pos);
      h.position.y = b.pos.y + Math.abs(Math.sin(t*2.2))*0.02;
      h.position.x = b.pos.x + Math.sin(t*2.2)*0.015;
    }
    sway(get('mixamorig:Spine'), _Z, 0.03, 0, t);
    sway(get('mixamorig:Neck'), _Z, 0.04, 0.4, t);
    sway(get('mixamorig:Head'), _Z, 0.05, 0.7, t);
    sway(get('mixamorig:LeftShoulder'), _X, 0.07, Math.PI/2, t);
    sway(get('mixamorig:RightShoulder'), _X, 0.07, -Math.PI/2, t);
  }
  controls.update();
  updateSprites();
  renderer.render(scene, camera);
}

// --- UI ---
function el(id){ return document.getElementById(id); }
function refreshHairUI() {
  const mk = (id, prefix) => {
    const c = el(id); c.innerHTML='';
    for (const [k,v] of Object.entries(HAIRS)) {
      if (!k.startsWith(prefix)) continue;
      const b = document.createElement('div');
      b.className = 'style-btn'+(k===curHair?' active':'');
      b.innerHTML = `<img class="thumb" src="${v.front}"><div>${v.name}</div>`;
      b.onclick = ()=>buildHair(k);
      c.appendChild(b);
    }
  };
  mk('hair-m','m'); mk('hair-f','f');
}
function refreshEyeUI() {
  const mk = (id, prefix) => {
    const c = el(id); c.innerHTML='';
    for (const [k,v] of Object.entries(EYES)) {
      if (!k.startsWith(prefix)) continue;
      const b = document.createElement('div');
      b.className = 'style-btn'+(k===curEye?' active':'');
      b.innerHTML = `<img class="thumb" src="${v.front}"><div>${v.name}</div>`;
      b.onclick = ()=>buildEyes(k, k);
      c.appendChild(b);
    }
  };
  mk('eye-m','m'); mk('eye-f','f');
}
document.querySelectorAll('#tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    el('tab-hair').style.display = b.dataset.tab==='hair'?'':'none';
    el('tab-eyes').style.display = b.dataset.tab==='eyes'?'':'none';
  };
});
document.querySelectorAll('#anims button').forEach(b=>{ b.onclick=()=>setAnim(b.dataset.anim); });
refreshHairUI(); refreshEyeUI();
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
