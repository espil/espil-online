<!DOCTYPE html>

<head>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% 42%, rgba(16,45,57,.40) 0, rgba(4,13,19,.16) 34%, rgba(1,3,6,0) 62%),

    color: #f3f7f3;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;

    min-height: 100svh; padding: 24px 18px; text-align: center;
  }
  .box { max-width: 520px; }
  .brand {
    margin: 0 0 14px; font-size: 13px; font-weight: 800;
    letter-spacing: .34em; text-indent: .34em; color: #86eee4;
    text-transform: uppercase;
  }
  .code {
    margin: 0; font-size: clamp(84px, 22vw, 148px); font-weight: 800; line-height: 1;

    letter-spacing: .02em;
  }
  .rule {
    width: 180px; height: 1px; margin: 26px auto 24px; border: 0;
    background: linear-gradient(90deg, transparent, #86eee4, transparent);
    box-shadow: 0 0 10px rgba(134,238,228,.6);
  }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 800; color: #ffffff; line-height: 1.4; }

  .home {
    display: inline-block; margin-top: 32px; padding: 13px 30px;
    border: 1px solid #ffd97a; border-radius: 12px;
    background: linear-gradient(180deg, #ffd97a, #e8ae3c);
    color: #241a04; font-size: 15px; font-weight: 800; letter-spacing: .02em;
    text-decoration: none;
  }
  .home:hover, .home:focus-visible { background: linear-gradient(180deg, #ffe4a1, #f2bc55); }

</head>
