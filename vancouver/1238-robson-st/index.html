<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espil Online - Entering the building</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1116; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: "Avenir Next", "Segoe UI", Manrope, sans-serif; color: #eaf6ff; }
  .box { text-align: center; padding: 24px; }
  .ttl { font-weight: 800; letter-spacing: .14em; font-size: .95rem; color: #8ef7e8; }
  .sub { margin-top: 10px; font-size: .85rem; opacity: .85; line-height: 1.6; }
</style>
</head>
<body>
<div class="box">
  <div class="ttl">ESPIL ONLINE</div>
  <div class="sub">Entering the building&hellip;</div>
</div>
<script>
/* Place-space boot shell (building spaces, Han 2026-11-16).
   This address IS a building (place): the page's only job is to
   hand the visit to the game page in place-space mode. It reads
   {city, placeSlug} from its OWN path (/<city>/<slug>/, with or
   without the trailing slash or an index.html tail), writes the
   one-shot sessionStorage mark espil_store_space_v1, and replaces
   itself with the city's game page, where the place-space module
   summons the player into that building's own space. No store or
   goods data lives here - the space asks the API at entry.
   The previous standalone store page is preserved byte-identical
   as sample.html in this same directory; the parent module's
   destination flag (modules/store-page-link.js) is the revert
   switch that points entries back at it. */
(function () {
  'use strict';
  var seg = location.pathname.split('/').filter(function (s) { return !!s; });
  if (seg.length && /\.html?$/i.test(seg[seg.length - 1])) seg.pop();
  var slug = seg.length ? seg[seg.length - 1] : '';
  var city = seg.length > 1 ? seg[seg.length - 2] : '';
  try {
    sessionStorage.setItem('espil_store_space_v1',
      JSON.stringify({ city: city, slug: slug, at: Date.now() }));
    /* The arrival must take the game's own handoff path: the
       entry machinery (the intro dive, the location gate, the
       parked-session rule) keys handoff grade on the landing
       dive's one-shot espil_pending_city, so the shell writes it
       too, with the city's display name (the value the landing
       itself stores). The intro consumes it on read; the place
       mark above is what routes the arrival into the space. */
    sessionStorage.setItem('espil_pending_city',
      city.charAt(0).toUpperCase() + city.slice(1));
  } catch (e) {}
  location.replace('/' + city + '.html');
})();
</script>
</body>
</html>
